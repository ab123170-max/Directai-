name: Build Cameraman AI APK

on:
  push:
    branches:
      - upgrade/native-kotlin-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Do not enable npm caching until package-lock.json is committed.
          # setup-node cache: npm fails before install when no lockfile exists.

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.cameramanai.studio",
            "appName": "Cameraman AI",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android

      # Capacitor creates the Android project during CI, so declare permissions
      # here before building. Without these manifest entries Android may not
      # expose Camera/Microphone app permissions in Settings.
      - name: Declare Android camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest not found: {manifest}")

          xml = manifest.read_text()
          permissions = [
              "    <uses-permission android:name=\"android.permission.CAMERA\" />",
              "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />",
          ]
          missing = [line for line in permissions if line.split('"')[1] not in xml]
          if missing:
              marker = "<application"
              if marker not in xml:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              xml = xml.replace(marker, "\\n".join(missing) + "\\n\\n" + marker, 1)
              manifest.write_text(xml)
          print(manifest.read_text())
          PY

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cameraman-AI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
